name: Test

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "project/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/test.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (macOS, Godot ${{ matrix.godot }})
    runs-on: macos-latest

    # gdzig generates its bindings from the Godot 4.7 API description it
    # vendors, but the extension still declares a 4.6 floor. Running the
    # integration smoke on both ends keeps that floor honest: a 4.7-only
    # method bind creeping into the extension fails the 4.6 leg.
    strategy:
      fail-fast: false
      matrix:
        godot: ["4.6.3", "4.7.1"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # gdzig resolves a Godot executable at configure time and panics
      # without one, so every job needs this even when it never runs Godot.
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false

      - name: Run core tests
        run: zig build test --summary all

      - name: Build extension
        run: zig build --summary all

      - name: Decode smoke test
        run: zig build decode-smoke

      - name: Godot integration smoke test
        timeout-minutes: 2
        run: zig build smoke

  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Never run here -- only present to satisfy gdzig's configure-time
      # lookup. The Windows leg has no Godot integration test.
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.1"
          use-dotnet: false

      - name: Setup FFmpeg
        run: choco install ffmpeg --yes --no-progress

      - name: Generate mandatory decode fixtures
        shell: bash
        run: |
          bash tools/gen_stress_media.sh --duration 3
          cp tests/fixtures/stress/bframes.mp4 project/bframes.mp4
          test -s project/bframes.mp4
          test -s tests/fixtures/stress/nonmod16_854x480.mp4

      - name: Run core tests
        run: zig build test --summary all

      - name: Build extension
        run: zig build --summary all

      - name: Decode smoke test
        run: zig build decode-smoke -- project/bframes.mp4
