name: Test

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "tests/**"
      - "addon/**"
      - "project/**"
      - "tools/**"
      - "build.zig"
      - "build.zig.zon"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      linux_extended:
        description: Run GStreamer and additional rendered regressions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    uses: ./.github/workflows/build.yml

  native:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      ZIG_LOCAL_PKG_DIR: ${{ github.workspace }}/.zig-cache/packages
    strategy:
      fail-fast: false
      matrix:
        os: &hosts [macos-latest, &linux ubuntu-22.04, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      # gdzig resolves Godot at build configure time, even for native tests.
      - name: Setup stock Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: &primary-godot "4.7.2"
          use-dotnet: false

      - name: Record versions
        run: |
          mkdir -p ci-logs
          godot=$(command -v godot)
          if [[ "$RUNNER_OS" == Windows ]]; then godot=$(cygpath -am "$godot"); fi
          printf 'GODOT_PATH=%s\n' "$godot" >> "$GITHUB_ENV"
          { zig version; "$godot" --version; } 2>&1 | tee ci-logs/versions.log

      - name: Install Linux GStreamer development packages and codecs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Ubuntu runner's LLVM unwinder conflicts with libunwind-dev.
          sudo apt-get remove -y libunwind-14-dev
          sudo apt-get install -y --no-install-recommends pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav
          pkg-config --modversion gstreamer-1.0 gstreamer-app-1.0 \
            gstreamer-video-1.0 gstreamer-audio-1.0 gstreamer-pbutils-1.0 | tee ci-logs/gstreamer-versions.log

      - name: Run native tests and install the tested smoke runner
        timeout-minutes: 8
        run: zig build test validation-runner --summary all --test-timeout 120s 2>&1 | tee ci-logs/native-tests.log

      - name: Media fixture tests
        timeout-minutes: 5
        run: zig build test-media --summary all --test-timeout 30s 2>&1 | tee ci-logs/media-tests.log

      - name: GStreamer AAC seek and input rejection
        if: runner.os == 'Linux' && inputs.linux_extended
        timeout-minutes: 5
        run: zig build test-gst-extended -Doptimize=debug --summary all --test-timeout 30s 2>&1 | tee ci-logs/gstreamer-regressions.log

      - name: Upload smoke runner
        uses: actions/upload-artifact@v7
        with:
          name: smoke-runner-${{ matrix.os }}
          path: zig-out/bin/validation-runner${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-tests-${{ matrix.os }}
          path: ci-logs/*.log

  test:
    name: Build & Smoke (${{ matrix.os }}, Godot ${{ matrix.godot }})
    needs: [build, native]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: *hosts
        godot: [*primary-godot, "4.6.3"]
        include:
          - os: *linux
            godot: *primary-godot
            transport: true
    env:
      PRIMARY_LINUX: ${{ matrix.transport }}
      LINUX_EXTENDED: ${{ matrix.transport && inputs.linux_extended }}
      DECODE_FIXTURES: ${{ github.workspace }}/tests/fixtures/decode
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Setup stock Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ matrix.godot }}
          use-dotnet: false

      - name: Record Godot version
        run: |
          mkdir -p ci-logs
          godot=$(command -v godot)
          if [[ "$RUNNER_OS" == Windows ]]; then godot=$(cygpath -am "$godot"); fi
          printf 'GODOT_PATH=%s\n' "$godot" >> "$GITHUB_ENV"
          "$godot" --version | tee ci-logs/versions.log

      - name: Install Linux GStreamer and software Vulkan
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gstreamer1.0-tools \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav \
            xvfb xauth mesa-vulkan-drivers libvulkan1
          gst-inspect-1.0 --version | tee ci-logs/gstreamer-versions.log
          gst-inspect-1.0 avdec_h264 > ci-logs/h264-decoder.log
          gst-inspect-1.0 avdec_aac > ci-logs/aac-decoder.log

      - name: Download smoke runner
        uses: actions/download-artifact@v8
        with:
          name: smoke-runner-${{ matrix.os }}
          path: smoke-tools

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          name: native-video-${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }}
          path: staging

      - name: Install release extension
        run: |
          mkdir -p project/lib
          case "$RUNNER_OS" in
            macOS) cp staging/libnative_video.macos.release.dylib project/lib/libnative_video.dylib ;;
            Windows) cp staging/native_video.windows.release.x86_64.dll project/lib/native_video.dll ;;
            Linux) cp staging/libnative_video.linux.release.x86_64.so project/lib/libnative_video.so ;;
            *) echo "Unsupported runner OS: $RUNNER_OS" >&2; exit 1 ;;
          esac

      - name: Reject unresolved Linux symbols
        if: runner.os == 'Linux'
        run: |
          ldd -r project/lib/libnative_video.so 2>&1 | tee ci-logs/ldd.log
          if grep -E 'undefined symbol|not found' ci-logs/ldd.log; then exit 1; fi

      - name: Rendered Godot smoke
        timeout-minutes: ${{ env.LINUX_EXTENDED == 'true' && 10 || env.PRIMARY_LINUX == 'true' && 5 || 4 }}
        run: |
          runner=smoke-tools/validation-runner
          prefix=(); display=()
          case "$RUNNER_OS" in
            Linux)
              export VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
              export VK_ICD_FILENAMES="$VK_DRIVER_FILES" LIBGL_ALWAYS_SOFTWARE=1
              test -f "$VK_DRIVER_FILES"
              export XDG_RUNTIME_DIR="$RUNNER_TEMP/native-video-runtime"
              mkdir -p "$XDG_RUNTIME_DIR"; chmod 700 "$XDG_RUNTIME_DIR"
              # The runner's 75s deadline can't reach xvfb-run or Xvfb, its parents.
              prefix=(timeout --kill-after=5 85 xvfb-run -a -e ci-logs/xvfb.log -s '-screen 0 640x480x24 -nolisten tcp')
              driver=vulkan
              display=(--display-driver x11)
              ;;
            macOS) driver=default ;;
            Windows) runner+=.exe; driver=d3d12 ;;
          esac
          chmod +x "$runner"
          run_rendered() {
            local name=$1 marker=$2; shift 2
            local log="ci-logs/$name.log"
            if ! "${prefix[@]}" "$runner" --godot "$GODOT_PATH" --project project --driver "$driver" \
                --log "$log" --marker "$marker" -- "${display[@]}" "$@"; then
              if [[ -f "$log" ]]; then tail -60 "$log" >&2; fi
              return 1
            fi
          }
          transport() {
            run_rendered "transport-$1" LINUX_TRANSPORT_PASS --script res://linux_transport_test.gd -- \
              --file="$DECODE_FIXTURES/$2" --expect-audio="$3"
          }
          run_rendered smoke 'SMOKE: PASS' -- --smoke
          if [[ "$PRIMARY_LINUX" == true ]]; then
            run_rendered codec-smoke CODEC_SMOKE_PASS --script res://codec_smoke.gd
            transport av h264-aac.mp4 1
          fi
          if [[ "$LINUX_EXTENDED" == true ]]; then
            run_rendered presentation-epoch PRESENTATION_EPOCH_PASS --script res://presentation_epoch_test.gd -- \
              --file="$DECODE_FIXTURES/h264-silent.mp4"
            run_rendered transport-oracles LINUX_TRANSPORT_ORACLES_PASS --script res://linux_transport_oracles_test.gd
            transport silent h264-silent.mp4 0
            transport hevc10 hevc-main10-pq.mp4 0
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-${{ matrix.os }}-godot-${{ matrix.godot }}
          path: |
            ci-logs/*.log
            ci-logs/*.json
          if-no-files-found: warn

  build-smoke-gate:
    # Branch protection requires an exact check name, independent of matrix versions.
    name: Build & Smoke (all)
    needs: [build, native, test]
    if: always() # GitHub accepts skipped checks, so run even if a dependency fails.
    runs-on: ubuntu-latest
    steps:
      - name: Require builds, native tests, and smoke tests to pass
        run: |
          test "${{ needs.build.result }}" = success
          test "${{ needs.native.result }}" = success
          test "${{ needs.test.result }}" = success
