kind: fixed
body: >
  Avoid main-thread decoder waits when starting or looping a video, seeking back
  to zero, or stopping repeatedly. Rewinds now decode asynchronously, holding the
  current image and playback clock until the first new frame is ready. Nonzero
  frame-accurate seeks retain their existing synchronous behavior. Audio top-ups
  yield to an in-flight video decode instead of stalling the render thread, and a
  seek that never completes now warns and stops playback rather than freezing the
  image silently.
