changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.VersionNoPrefix}}](https://github.com/claytercek/godot-native-video/compare/{{.PreviousVersion}}...{{.Version}}) ({{.Time.Format "2006-01-02"}})'
kindFormat: '### {{.Kind}}'
changeFormat: '* {{.Body | indent 2 | trim}}'
body:
  block: true
  minLength: 1
kinds:
  # Until 1.0, breaking changes advance the minor version.
  - label: Breaking Changes
    key: breaking
    auto: minor
  - label: Added
    key: added
    auto: minor
  - label: Changed
    key: changed
    auto: minor
  - label: Deprecated
    key: deprecated
    auto: minor
  - label: Removed
    key: removed
    auto: minor
  - label: Fixed
    key: fixed
    auto: patch
  - label: Security
    key: security
    auto: patch
newlines:
  beforeChangelogVersion: 1
  beforeKind: 1
  endOfVersion: 1
